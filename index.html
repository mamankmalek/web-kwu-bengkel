    <script>
      try {
        var savedTheme = localStorage.getItem('lbmm_theme');
        var resolvedTheme = savedTheme || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.dataset.theme = resolvedTheme;
        if (resolvedTheme === 'dark') document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
